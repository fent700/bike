name: Bike
options:
  bundleIdPrefix: com.bike
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

# Declared explicitly rather than left to Xcode. Xcode invents a scheme the
# first time you open a project, but it lands in xcuserdata — which does not
# exist on a fresh CI checkout, so `xcodebuild -scheme Bike` would fail with
# "scheme not found" right after xcodegen reported success.
schemes:
  Bike:
    build:
      targets:
        Bike: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Bike:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The built web app (web/ → `npm run build:ios`). A folder reference, not
      # a group, so it lands in the bundle as Bike.app/Web/ with its assets/
      # subdirectory intact — a group would flatten every file into the bundle
      # root and break each relative URL in index.html.
      #
      # XcodeGen refuses a source path that doesn't exist, so the web build has
      # to run before `xcodegen generate`. CI does it in that order.
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bike.hud
        PRODUCT_NAME: Bike
        INFOPLIST_FILE: Sources/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
